name: Build
run-name: linux ${{ github.event.pull_request.title }} ${{ github.event.head_commit.message }}
# see https://docs.github.com/en/webhooks/webhook-events-and-payloads#pull_request

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  id-token: write

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # installer is always built with a specific version of Python
        os: [ubuntu-22.04]
        python-version: ["3.13"]

    env:
      # define environment and configuration variables here.
      # app_name is how the application will be named on the disk image.
      # product_name is the name of the disk image (.dmg) that gets built.
      # python_version specifies which version of Python to use.
      # this should be regularly updated to the latest usable version.
      app_name: "Nion Swift 16"
      product_name: NionSwift-16.16.1
      platform: x86_64
      tool_source_version: 5.1.5

    steps:
    - uses: actions/checkout@v5

    # first set up Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    # next build the installer (it's a disk image with the application).
    - name: Build
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
        chmod +x /usr/local/bin/appimagetool
        python -m venv venv-appimage
        source ./venv-appimage/bin/activate
        # appimage-builder requires pip 24.3 as of version 1.1.0 (which hasn't been updated for a while)
        python -m pip install pip==24.3
        # python -m pip install --upgrade pip
        echo "Installing appimage-builder"
        python -m pip install appimage-builder
        echo "Running appimage-builder with recipe nionswift_appimage.yml"
        appimage-builder --recipe nionswift_appimage.yml

    - name: Setup Cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign the zip file
      run: |
        # Use cosign sign-blob to sign the zip file.
        base_file="${{ env.product_name }}-${{ env.platform }}.AppImage"
        cosign sign-blob --verbose --yes $base_file --bundle $base_file.cosign.bundle

    # finally, upload the artifacts of the build so that they are available on the GitHub action page.
    - name: Upload Product
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: ${{ env.product_name }}-${{ env.platform }}.AppImage
        path: ${{ env.product_name }}-${{ env.platform }}.AppImage

    - name: Upload Product Signature
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: ${{ env.product_name }}-${{ env.platform }}.AppImage.cosign.bundle
        path: ${{ env.product_name }}-${{ env.platform }}.AppImage.cosign.bundle
